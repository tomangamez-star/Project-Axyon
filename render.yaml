services:
  - type: web
    name: architect-wa-rpg
    runtime: node
    plan: free
    # render-build.sh installs yt-dlp + ffmpeg/ffprobe into .tools/bin and then
    # runs npm ci. Without it `!play` has no downloader on Render's Node image.
    buildCommand: bash render-build.sh
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WA_SESSION_ID
        value: architect-primary
      - key: WA_MAX_SESSIONS
        value: 5
